# cargo-deny: licences and advisories of every
# dependency, checked in CI (job `supply-chain`).

[graph]
all-features = true

[advisories]
# Every advisory in the RustSec database fails the check, unless listed.
ignore = []

[licenses]
# Permissive licences only (the workspace is MIT).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# One crate each, so a new dependency under these licences still fails.
exceptions = [
    # ROOT's LZ4 records and RNTuple's envelopes and pages carry xxHash
    # checksums (Boost licence).
    { allow = ["BSL-1.0"], crate = "xxhash-rust" },
    # Through arrow-array -> ahash -> const-random-macro, at compile time
    # (public-domain dedication).
    { allow = ["CC0-1.0"], crate = "tiny-keccak" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
