# Every push and pull request: fast checks on three platforms, the uproot
# and ROOT cross-checks, WASM, the MSRV, licences and the public API. The
# slower checks run nightly (nightly.yml).
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the uproot oracle
        run: python -m pip install uproot==5.7.8 numpy awkward==2.15.1 lz4 zstandard xxhash
      - name: Test (with the uproot cross-check)
        shell: bash
        run: |
          export RHIZOID_ORACLE_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          RHIZOID_UI=1 cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Line coverage of the whole suite (with the uproot oracle; the ROOT
  # cross-checks run in their own job): fails below the floor, keeps the
  # report. Measured at 83.7% when the floor was set.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the uproot oracle
        run: python -m pip install uproot==5.7.8 numpy awkward==2.15.1 lz4 zstandard xxhash
      - name: Measure coverage
        shell: bash
        run: |
          export RHIZOID_ORACLE_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          cargo llvm-cov --workspace --all-features --fail-under-lines 83             --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tail -1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info

  # What the fuzzers found, replayed as they ran it (checksums skipped, a
  # compile-time switch of fuzz builds only); the fuzz targets still build.
  fuzz-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: Replay the fuzz findings
        run: cargo test -p rhizoid-io --test fuzz_regressions
        env:
          RUSTFLAGS: -D warnings --cfg fuzzing
      - name: The fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

  # Every branch of ~40 MB of ROOT-written files
  # (scikit-hep-testdata) compared with uproot.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uproot==5.7.8 numpy awkward==2.15.1 lz4 zstandard xxhash scikit-hep-testdata
      - uses: actions/cache@v4
        with:
          path: corpus
          key: corpus-${{ hashFiles('tests/cross/fetch_corpus.py') }}
      - run: python tests/cross/fetch_corpus.py corpus
      - name: Compare the corpus with uproot
        run: |
          export RHIZOID_ORACLE_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export RHIZOID_CORPUS="$PWD/corpus" RHIZOID_CORPUS_REPORT="$PWD/corpus-report.md"
          export RHIZOID_RNTUPLE_REPORT="$PWD/rntuple-report.md"
          cargo test -p rhizoid-io --test corpus
          cargo test -p rhizoid-io --test rntuple
          cargo test -p rhizoid-arrow --test arrow corpus
          cargo test -p rhizoid-io --features http --test sources corpus
          cargo test --release -p rhizoid-io --features async,http --test asynchronous
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-report
          path: |
            corpus-report.md
            rntuple-report.md

  # Against ROOT: ROOT reads what we write, we read what ROOT writes, and
  # ROOT's objects survive a rewrite; then ROOT opens every fixture.
  root:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: root
          key: root-6.42.00-ubuntu24.04-gcc13.3
      - name: Install ROOT 6.42.00
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libtbb-dev libvdt-dev libgif-dev \
            libxpm-dev libxft-dev libxext-dev nlohmann-json3-dev libgsl-dev libxxhash-dev
          if [ ! -x root/bin/root ]; then
            curl -sSfL https://root.cern/download/root_v6.42.00.Linux-ubuntu24.04-x86_64-gcc13.3.tar.gz | tar -xz
          fi
      - name: Cross-check with ROOT
        run: |
          source root/bin/thisroot.sh
          RHIZOID_ROOT=root cargo test -p rhizoid-io --test root --test derive --test tree_write --test ntuple_write --test update --test crash --test split
          for f in crates/rhizoid-io/tests/data/*.root; do
            root -b -q -l "tools/root_smoke.C(\"$f\")"
          done

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo check -p rhizoid-io --features async,http

  # The core, async reading and the browser's `fetch` source build for
  # WASM, and the fixtures decode there exactly as natively (sync and
  # async), under Node.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Must match the wasm-bindgen version in Cargo.lock.
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: cargo clippy -p rhizoid-io --target wasm32-unknown-unknown --features async,http --lib --test wasm -- -D warnings
      - run: cargo build -p rhizoid-io --target wasm32-unknown-unknown
      - run: cargo test -p rhizoid-io --target wasm32-unknown-unknown --features async --test wasm
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner

  # Licences and advisories of every dependency.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The public API against the 1.0 baseline (the `v1.0.0` tag): no
  # breaking change in a 1.x release.
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the API against v1.0.0
        run: |
          if git rev-parse -q --verify refs/tags/v1.0.0 >/dev/null; then
            cargo install cargo-semver-checks --locked
            cargo semver-checks --workspace --baseline-rev v1.0.0
          else
            echo "no v1.0.0 tag yet: the baseline is recorded at the release"
          fi
