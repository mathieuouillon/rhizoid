# Nightly: what is too slow or too wide for
# every pull request.
#
# - roots: ROOT 6.26, 6.30, 6.34 and the latest read what we write and we
#   read what they write (TTrees and objects from 6.26, RNTuples from
#   6.34), in ROOT's own images;
# - benchmarks: against the previous night;
# - fuzz: every fuzz target for five minutes, from the corpus it grew;
# - differential: ROOT and uproot read the files the write_rows corpus
#   makes rhizoid write;
# - coverage: every branch of the corpus as ROOT reads it
#   (tests/coverage.rs), and the data-driven cases against every source,
#   corpus included; the reports are kept as artifacts;
# - crash: the update crash harness in release mode;
# - timings: `cargo build --timings` for rhizoid-io (an alert, not a gate).
name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  roots:
    strategy:
      fail-fast: false
      matrix:
        include:
          - root: "6.26.14"
            image: rootproject/root:6.26.14-ubuntu22.04
            rntuple: false
          - root: "6.30.06"
            image: rootproject/root:6.30.06-ubuntu22.04
            rntuple: false
          - root: "6.34.00"
            image: rootproject/root:6.34.00-ubuntu24.04
            rntuple: true
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    name: ROOT ${{ matrix.root }}
    steps:
      - name: Tools the image lacks
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates git build-essential
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: root-${{ matrix.root }}
      - name: Cross-check with ROOT ${{ matrix.root }}
        shell: bash
        run: |
          tests="--test root --test derive --test tree_write --test update --test crash --test split"
          if [ "${{ matrix.rntuple }}" = "true" ]; then tests="$tests --test ntuple_write"; fi
          RHIZOID_ROOT=root cargo test --no-fail-fast -p rhizoid-io $tests
          for f in crates/rhizoid-io/tests/data/*.root; do
            case "$f" in
              *rntuple*|*ntuple*) [ "${{ matrix.rntuple }}" = "true" ] || continue ;;
            esac
            root -b -q -l "tools/root_smoke.C(\"$f\")"
          done

  latest:
    runs-on: ubuntu-24.04
    name: ROOT 6.42 (latest), coverage and cases
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: root
          key: root-6.42.00-ubuntu24.04-gcc13.3
      - name: Install ROOT 6.42.00
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libtbb-dev libvdt-dev libgif-dev \
            libxpm-dev libxft-dev libxext-dev nlohmann-json3-dev libgsl-dev libxxhash-dev
          if [ ! -x root/bin/root ]; then
            curl -sSfL https://root.cern/download/root_v6.42.00.Linux-ubuntu24.04-x86_64-gcc13.3.tar.gz | tar -xz
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uproot==5.7.8 numpy awkward==2.15.1 lz4 zstandard xxhash scikit-hep-testdata
      - uses: actions/cache@v4
        with:
          path: corpus
          key: corpus-${{ hashFiles('tests/cross/fetch_corpus.py') }}
      - run: python tests/cross/fetch_corpus.py corpus
      - name: Coverage against ROOT, and the cases against every source
        run: |
          source root/bin/thisroot.sh
          export RHIZOID_ROOT=root RHIZOID_CORPUS="$PWD/corpus"
          export RHIZOID_COVERAGE_REPORT="$PWD/coverage-report.md"
          export RHIZOID_ORACLE_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          cargo test --release -p rhizoid-io --all-features --test coverage --test cases
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-report.md

  # Each fuzz target (fuzz/) for five minutes, from the corpus the earlier
  # nights grew (kept in the Actions cache, minimized after each run): the
  # minutes add up. A crash fails the job; its input is kept as an
  # artifact, to add to crates/rhizoid-io/tests/data/fuzz.
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target:
          - open_file
          - decompress
          - records
          - streamer_infos
          - rntuple_envelopes
          - rntuple_pages
          - basket
          - write_rows
          - write_split
          - histograms
          - update_ops
          - sources_agree
    runs-on: ubuntu-latest
    name: fuzz ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz ${{ matrix.target }}
        run: |
          seeds=""
          case "${{ matrix.target }}" in
            open_file|sources_agree)
              mkdir -p seeds && cp crates/rhizoid-io/tests/data/*.root crates/rhizoid-io/tests/data/fuzz/* seeds/
              seeds=seeds ;;
          esac
          mkdir -p fuzz/corpus/${{ matrix.target }}
          echo "corpus: $(ls fuzz/corpus/${{ matrix.target }} | wc -l) inputs"
          cargo fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} $seeds -- \
            -max_total_time=300 -timeout=10 -rss_limit_mb=2048 -max_len=262144
      - name: Minimize the corpus
        run: cargo fuzz cmin ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- -rss_limit_mb=2048
      - name: Keep the corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts

  # Differential: ROOT and uproot read the files write_rows writes from the
  # corpus the fuzzer grew, and must find exactly the rows rhizoid wrote.
  differential:
    needs: fuzz
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Restore the write_rows corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/write_rows
          key: fuzz-corpus-write_rows-${{ github.run_id }}
          restore-keys: fuzz-corpus-write_rows-
      - uses: actions/cache@v4
        with:
          path: root
          key: root-6.42.00-ubuntu24.04-gcc13.3
      - name: Install ROOT 6.42.00
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libtbb-dev libvdt-dev libgif-dev \
            libxpm-dev libxft-dev libxext-dev nlohmann-json3-dev libgsl-dev libxxhash-dev
          if [ ! -x root/bin/root ]; then
            curl -sSfL https://root.cern/download/root_v6.42.00.Linux-ubuntu24.04-x86_64-gcc13.3.tar.gz | tar -xz
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uproot==5.7.8 numpy awkward==2.15.1 lz4 zstandard xxhash
      - name: ROOT and uproot read what rhizoid wrote
        run: |
          if [ ! -d fuzz/corpus/write_rows ]; then echo "no corpus yet"; exit 0; fi
          cargo run --release --manifest-path fuzz/Cargo.toml --example differential -- \
            fuzz/corpus/write_rows differential-out 500
          source root/bin/thisroot.sh
          python fuzz/differential/check.py differential-out --root root

  # The benchmarks (crates/rhizoid-io/benches), against the previous night:
  # a mean more than 25% slower fails the job. A failed night keeps the
  # older results as the reference.
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Restore the previous results
        uses: actions/cache/restore@v4
        with:
          path: target/criterion
          key: criterion-${{ github.run_id }}
          restore-keys: criterion-
      - run: cargo bench -p rhizoid-io --bench io
      - name: Compare with the previous night
        run: python3 crates/rhizoid-io/benches/regressions.py
      - name: Keep the results
        uses: actions/cache/save@v4
        with:
          path: target/criterion
          key: criterion-${{ github.run_id }}

  crash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p rhizoid-io --test crash --test update

  timings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p rhizoid-io --timings
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-timings
          path: target/cargo-timings/cargo-timing.html
