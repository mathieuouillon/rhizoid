[package]
name = "rhizoid-object-store"
description = "Read ROOT files from object stores (S3, GCS, Azure, HTTP, local) with rhizoid."
# Its own version: a breaking release with each arrow / object_store major.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
rhizoid-source.workspace = true
rhizoid-io.workspace = true
bytes.workspace = true
object_store = { version = "0.14", default-features = false, features = ["fs"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "rt-multi-thread"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
url = "2.5"

[features]
## Amazon S3 (`s3://`).
aws = ["object_store/aws"]
## Google Cloud Storage (`gs://`).
gcp = ["object_store/gcp"]
## Azure Blob Storage (`az://`, `abfs://`).
azure = ["object_store/azure"]
## Plain HTTP(S) and WebDAV servers.
http = ["object_store/http"]

[dev-dependencies]
rhizoid-io = { workspace = true, features = ["http", "async"] }
tokio = { version = "1.54", default-features = false, features = ["rt"] }

[lints]
workspace = true
