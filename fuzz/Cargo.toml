[package]
name = "rhizoid-fuzz"
version = "0.0.0"
description = "Fuzz targets for rhizoid-io (cargo fuzz)."
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
rhizoid-io = { path = "../crates/rhizoid-io", features = ["_fuzz", "async", "xrootd"] }

# Its own workspace: nightly-only, kept out of the main one.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "open_file"
path = "fuzz_targets/open_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decompress"
path = "fuzz_targets/decompress.rs"
test = false
doc = false
bench = false

[[bin]]
